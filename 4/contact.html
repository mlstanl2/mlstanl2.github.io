<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <link rel="icon" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Contact Us & Suggest a Park</h1>

        <p>
            Have a park you think should be featured?
            Send us your suggestion.
        </p>
    </header>


    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="explore.html">Explore Parks</a>
        <a href="planning.html">Planning Guide</a>
        <a href="contact.html">Contact Us</a>
    </nav>


    <main>

        <section class="contact-form">

            <h2>Suggest a Park</h2>

            <form>

                <label for="name">Name:</label>

                <input type="text"
                    id="name"
                    name="name">


                <label for="contact-email">Email:</label>

                <input type="email"
                    id="contact-email"
                    name="email">


                <label for="park">Park Name:</label>

                <input type="text"
                    id="park"
                    name="park">


                <label for="type">Park Type:</label>

                <select id="type" name="type">

                    <option value="theme">Theme Park</option>

                    <option value="water">Water Park</option>

                    <option value="wildlife">Wildlife Park</option>

                    <option value="national">National Park</option>

                </select>


                <label for="message">Message:</label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"></textarea>


                <button type="button">
                    Submit Suggestion
                </button>

            </form>

        </section>

    </main>


    <footer>
        <p>&copy; 2026 McKenzie Stanley</p>
    </footer>

</body>

</html>
