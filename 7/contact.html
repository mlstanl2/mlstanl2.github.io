<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Contact Us
  </title>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <h1>
    Contact Us &amp; Suggest a Park
   </h1>
   <p>
    Have a park you think should be featured?
            Send us your suggestion.
   </p>
  </header>
  <nav aria-label="Main navigation">
   <a href="index.html">
    Home
   </a>
   <a href="explore.html">
    Explore Parks
   </a>
   <a href="planning.html">
    Planning Guide
   </a>
   <a href="saved.html">My Saved Parks</a>
   <a href="contact.html">
    Contact Us
   </a>
   <a href="index.html#login">
    Log In
   </a>
  </nav>
  <main>
   <p id="auth-gate" role="status">
  Checking your login...
</p>

<div id="protected-content" hidden>
   <section class="contact-form">
    <h2>
     Suggest a Park
    </h2>
    <form id="suggestion-form">
     <label for="name">
      Name:
     </label>
     <input
  id="name"
  name="name"
  type="text"
  maxlength="100"
  required
>
     <label for="contact-email">
      Email:
     </label>
     <input id="contact-email" name="email" required="" type="email"/>
     <label for="park">
      Park Name:
     </label>
     <input
  id="park"
  name="park"
  type="text"
  maxlength="150"
  required
>
     <label for="type">
      Park Type:
     </label>
     <select id="type" name="type">
      <option value="theme">
       Theme Park
      </option>
      <option value="water">
       Water Park
      </option>
      <option value="wildlife">
       Wildlife Park
      </option>
      <option value="national">
       National Park
      </option>
     </select>
     <label for="message">
      Message:
     </label>
     <textarea
  id="message"
  name="message"
  rows="6"
  maxlength="2000"
  required
></textarea>
     <button type="submit">
      Submit Suggestion
     </button>
    </form>
    <p id="form-status" role="status" aria-live="polite">
    </p>
   </section>
  </main>
  <footer>
   <p>
    &copy; 2026 McKenzie Stanley
   </p>
  </footer>
  <script type="module" src="js/contact.js"></script>
  </script>
 </body>
</html>
